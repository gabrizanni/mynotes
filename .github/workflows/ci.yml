name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: "0.12.15"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

      - name: Check native Capture behavior
        run: uv run python scripts/test_capture_native.py

      - name: Audit public contents
        run: uv run python scripts/check_public_tree.py

      - name: Build Apple Silicon DMG candidate
        run: uv run python scripts/build_dmg.py

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mynotes-release-candidate
          path: |
            dist/*-macos-release.zip
            dist/*-macos-release.zip.sha256
            dist/MyNotes-*-macOS-arm64.dmg
            dist/MyNotes-*-macOS-arm64.dmg.sha256
          if-no-files-found: error
