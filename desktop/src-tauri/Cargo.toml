[package]
name = "mynotes-desktop"
version = "0.1.0"
description = "MyNotes Desktop: a calm window over the local MyNotes backend"
authors = ["MyNotes contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "mynotes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }

[dev-dependencies]
# Tauri's mock runtime, for window-routing tests without a display.
tauri = { version = "2", features = ["tray-icon", "test"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
