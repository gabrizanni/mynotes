[package]
name = "mynotes-desktop"
version = "0.1.0"
description = "MyNotes Desktop: a calm window over the local MyNotes backend"
authors = ["MyNotes contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
name = "mynotes_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
