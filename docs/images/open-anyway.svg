<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Open MyNotes on your Mac</title><desc id="desc">1. Try opening MyNotes. 2. Privacy &amp; Security. 3. Confirm the exception. Illustration only; labels may differ on your Mac.</desc><rect width="960" height="350" rx="22" fill="#f4f6fa"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="24" fill="#172641" font-weight="700">Open MyNotes on your Mac</text><rect x="30" y="67" width="290" height="229" rx="14" fill="#ffffff" stroke="#dce2ec"/><text x="46" y="95" font-size="17" font-weight="700" fill="#172641">1. Try opening MyNotes</text><text x="46" y="240" font-size="14" fill="#34455f">Open MyNotes from Applications.</text><text x="46" y="266" font-size="14" fill="#34455f">The app may be blocked on first use.</text><rect x="137" y="118" width="76" height="70" rx="18" fill="#3158c7"/><text x="175" y="163" font-size="30" font-weight="700" fill="white" text-anchor="middle">M</text><text x="175" y="210" font-size="15" fill="#172641" text-anchor="middle">MyNotes</text><rect x="335" y="67" width="290" height="229" rx="14" fill="#ffffff" stroke="#dce2ec"/><text x="351" y="95" font-size="17" font-weight="700" fill="#172641">2. Privacy &amp; Security</text><text x="351" y="240" font-size="14" fill="#34455f">Go to System Settings.</text><text x="351" y="266" font-size="14" fill="#34455f">Scroll to the blocked-app notice.</text><rect x="359" y="119" width="242" height="95" rx="9" fill="#eef2fa"/><circle cx="378" cy="136" r="4" fill="#b2bed3"/><circle cx="392" cy="136" r="4" fill="#b2bed3"/><rect x="404" y="155" width="154" height="35" rx="8" fill="#3158c7"/><text x="481" y="177" font-size="14" font-weight="600" fill="white" text-anchor="middle">Open Anyway</text><rect x="640" y="67" width="290" height="229" rx="14" fill="#ffffff" stroke="#dce2ec"/><text x="656" y="95" font-size="17" font-weight="700" fill="#172641">3. Confirm the exception</text><text x="656" y="240" font-size="14" fill="#34455f">Choose Open for MyNotes.</text><text x="656" y="266" font-size="14" fill="#34455f">Then continue the setup.</text><rect x="664" y="119" width="242" height="95" rx="9" fill="#eef2fa"/><circle cx="683" cy="136" r="4" fill="#b2bed3"/><circle cx="697" cy="136" r="4" fill="#b2bed3"/><rect x="709" y="155" width="98" height="35" rx="8" fill="#3158c7"/><text x="758" y="177" font-size="14" font-weight="600" fill="white" text-anchor="middle">Open</text><text x="30" y="326" font-size="13" fill="#52617a">Illustration only; labels may differ on your Mac.</text></g></svg>
