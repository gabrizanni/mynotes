<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Apri MyNotes sul tuo Mac</title><desc id="desc">1. Prova ad aprire MyNotes. 2. Privacy e sicurezza. 3. Conferma l’eccezione. Schema illustrato; le etichette possono cambiare sul tuo Mac.</desc><rect width="960" height="350" rx="22" fill="#f4f6fa"/><g font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><text x="30" y="42" font-size="24" fill="#172641" font-weight="700">Apri MyNotes sul tuo Mac</text><rect x="30" y="67" width="290" height="229" rx="14" fill="#ffffff" stroke="#dce2ec"/><text x="46" y="95" font-size="17" font-weight="700" fill="#172641">1. Prova ad aprire MyNotes</text><text x="46" y="240" font-size="14" fill="#34455f">Apri MyNotes da Applicazioni.</text><text x="46" y="266" font-size="14" fill="#34455f">Al primo avvio può essere bloccato.</text><rect x="137" y="118" width="76" height="70" rx="18" fill="#3158c7"/><text x="175" y="163" font-size="30" font-weight="700" fill="white" text-anchor="middle">M</text><text x="175" y="210" font-size="15" fill="#172641" text-anchor="middle">MyNotes</text><rect x="335" y="67" width="290" height="229" rx="14" fill="#ffffff" stroke="#dce2ec"/><text x="351" y="95" font-size="17" font-weight="700" fill="#172641">2. Privacy e sicurezza</text><text x="351" y="240" font-size="14" fill="#34455f">Apri Impostazioni di Sistema.</text><text x="351" y="266" font-size="14" fill="#34455f">Scorri fino all’avviso sull’app.</text><rect x="359" y="119" width="242" height="95" rx="9" fill="#eef2fa"/><circle cx="378" cy="136" r="4" fill="#b2bed3"/><circle cx="392" cy="136" r="4" fill="#b2bed3"/><rect x="404" y="155" width="154" height="35" rx="8" fill="#3158c7"/><text x="481" y="177" font-size="14" font-weight="600" fill="white" text-anchor="middle">Apri comunque</text><rect x="640" y="67" width="290" height="229" rx="14" fill="#ffffff" stroke="#dce2ec"/><text x="656" y="95" font-size="17" font-weight="700" fill="#172641">3. Conferma l’eccezione</text><text x="656" y="240" font-size="14" fill="#34455f">Scegli Apri per MyNotes.</text><text x="656" y="266" font-size="14" fill="#34455f">Poi continua il setup.</text><rect x="664" y="119" width="242" height="95" rx="9" fill="#eef2fa"/><circle cx="683" cy="136" r="4" fill="#b2bed3"/><circle cx="697" cy="136" r="4" fill="#b2bed3"/><rect x="709" y="155" width="98" height="35" rx="8" fill="#3158c7"/><text x="758" y="177" font-size="14" font-weight="600" fill="white" text-anchor="middle">Apri</text><text x="30" y="326" font-size="13" fill="#52617a">Schema illustrato; le etichette possono cambiare sul tuo Mac.</text></g></svg>
